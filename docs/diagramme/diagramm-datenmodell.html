<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datenmodell</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 880px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ATL #1 · Datenmodell</p>
    <h1>Ein User besitzt Links, ein Link sammelt Klicks</h1>

    <svg viewBox="0 0 960 304" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="atl1-daten-title atl1-daten-desc">
      <title id="atl1-daten-title">Datenmodell des URL-Shorteners</title>
      <desc id="atl1-daten-desc">ER-Modell mit drei Entitäten: Ein User besitzt beliebig viele Links, jeder Link erhält beliebig viele Klicks; beim Löschen eines Links werden seine Klicks kaskadiert mitgelöscht.</desc>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Beziehungen (vor den Boxen) -->
      <line x1="256" y1="120" x2="384" y2="120" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="268" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">1</text>
      <text x="372" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">N</text>
      <rect x="296" y="100" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="109" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BESITZT</text>

      <line x1="576" y1="120" x2="704" y2="120" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="588" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">1</text>
      <text x="692" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">N</text>
      <rect x="616" y="100" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="109" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ERHÄLT</text>

      <!-- Entität USER -->
      <rect x="64" y="48" width="192" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="48" width="192" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="56" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="94" y="65" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITÄT</text>
      <text x="160" y="70" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">USER</text>
      <line x1="64" y1="80" x2="256" y2="80" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="76" y="98" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
      <text x="76" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">email</text>
      <text x="244" y="114" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">UK</text>
      <text x="76" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">hashed_password</text>
      <text x="76" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">created_at</text>

      <!-- Entität LINK (fokal) -->
      <rect x="384" y="48" width="192" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="384" y="48" width="192" height="128" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="392" y="56" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="414" y="65" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITÄT</text>
      <text x="480" y="70" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LINK</text>
      <line x1="384" y1="80" x2="576" y2="80" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="396" y="98" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
      <text x="396" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">code</text>
      <text x="564" y="114" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">UK</text>
      <text x="396" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">target_url</text>
      <text x="396" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ owner_id</text>
      <text x="396" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">created_at</text>

      <!-- Entität CLICK -->
      <rect x="704" y="48" width="192" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="704" y="48" width="192" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="712" y="56" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="734" y="65" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITÄT</text>
      <text x="800" y="70" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CLICK</text>
      <line x1="704" y1="80" x2="896" y2="80" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="716" y="98" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"># id</text>
      <text x="716" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ link_id</text>
      <text x="716" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">created_at</text>

      <!-- Editorial-Anmerkung -->
      <text x="640" y="216" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">Löschen kaskadiert: Klicks gehen mit ihrem Link.</text>

      <!-- Legende -->
      <line x1="32" y1="252" x2="928" y2="252" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDE</text>
      <text x="144" y="272" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">#</text>
      <text x="160" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">PRIMÄRSCHLÜSSEL</text>
      <text x="320" y="272" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">→</text>
      <text x="336" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FREMDSCHLÜSSEL</text>
      <text x="496" y="272" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">UK</text>
      <text x="516" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">EINDEUTIG (UNIQUE)</text>
      <text x="688" y="272" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">1 · N</text>
      <text x="724" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">KARDINALITÄT</text>
    </svg>
  </div>
</body>
</html>
