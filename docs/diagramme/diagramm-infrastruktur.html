<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infrastruktur</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ATL #2 · Cloud-Deployment</p>
    <h1>Infrastruktur: vom Push zur laufenden App</h1>

    <svg viewBox="0 0 960 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="atl2-infra-title atl2-infra-desc">
      <title id="atl2-infra-title">Cloud-Infrastruktur des URL-Shorteners</title>
      <desc id="atl2-infra-desc">Ein Push auf GitHub startet Cloud Build; die Pipeline legt das Docker-Image in der Artifact Registry ab und deployt es auf Cloud Run, wo die App ihr Secret aus dem Secret Manager liest und öffentlich per HTTPS erreichbar ist.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: Google Cloud -->
      <rect x="420" y="64" width="500" height="296" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="444" y="68" width="264" height="12" rx="2" fill="#f5f5f5"/>
      <text x="576" y="77" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">GOOGLE CLOUD · PEA-HF-ICT · EUROPE-WEST6</text>

      <!-- Pfeile (vor den Boxen) -->
      <!-- Entwickler -> GitHub -->
      <line x1="160" y1="148" x2="220" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="168" y="128" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="190" y="137" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUSH</text>

      <!-- GitHub -> Cloud Build (Webhook-Trigger) -->
      <line x1="360" y1="148" x2="456" y2="148" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="380" y="128" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="408" y="137" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRIGGER</text>

      <!-- Cloud Build -> Artifact Registry -->
      <line x1="526" y1="176" x2="526" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="534" y="200" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="554" y="209" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IMAGE</text>

      <!-- Cloud Build -> Cloud Run (Deploy, Akzent) -->
      <path d="M 596,148 H 648 Q 656,148 656,156 V 192 Q 656,200 664,200 H 720" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="600" y="128" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="624" y="137" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEPLOY</text>

      <!-- Artifact Registry -> Cloud Run (Pull, passiv, mit Hop über HTTPS-Pfad) -->
      <path d="M 596,268 H 676 a 8,8 0 0,1 16,0 H 764 Q 772,268 772,260 V 244" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="608" y="248" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="626" y="257" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PULL</text>

      <!-- Secret Manager -> Cloud Run (Laufzeit-Secret) -->
      <line x1="828" y1="288" x2="828" y2="244" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="836" y="256" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="870" y="265" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SECRET_KEY</text>

      <!-- Browser -> Cloud Run (HTTPS) -->
      <path d="M 360,308 H 676 Q 684,308 684,300 V 232 Q 684,224 692,224 H 720" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="608" y="288" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="632" y="297" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

      <!-- Knoten -->
      <!-- Entwickler (Input) -->
      <rect x="40" y="120" width="120" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="120" width="120" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="100" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Entwickler</text>
      <text x="100" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">git push</text>

      <!-- GitHub (Extern) -->
      <rect x="220" y="120" width="140" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="120" width="140" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="290" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GitHub</text>
      <text x="290" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HE24-PEA-ATL</text>

      <!-- Cloud Build (fokal) -->
      <rect x="456" y="120" width="140" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="120" width="140" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="526" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cloud Build</text>
      <text x="526" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cloudbuild.yaml</text>

      <!-- Artifact Registry (Store) -->
      <rect x="456" y="240" width="140" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="240" width="140" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="526" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Artifact Registry</text>
      <text x="526" y="282" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">docker · url-shortener</text>

      <!-- Cloud Run (fokal) -->
      <rect x="720" y="180" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="180" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="800" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cloud Run</text>
      <text x="800" y="226" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI · SPA · SQLite</text>

      <!-- Secret Manager (Security) -->
      <rect x="720" y="288" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="288" width="160" height="48" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="800" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Secret Manager</text>
      <text x="800" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SECRET_KEY</text>

      <!-- Browser (Input) -->
      <rect x="220" y="280" width="140" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="280" width="140" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="290" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser</text>
      <text x="290" y="322" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">…europe-west6.run.app</text>

      <!-- Legende -->
      <line x1="30" y1="384" x2="930" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDE</text>
      <line x1="120" y1="400" x2="148" y2="400" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="156" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">BUILD-SCHRITT</text>
      <line x1="280" y1="400" x2="308" y2="400" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="316" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">DEPLOY (NUR MAIN)</text>
      <line x1="472" y1="400" x2="500" y2="400" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="508" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">HTTP(S)</text>
      <line x1="600" y1="400" x2="628" y2="400" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="636" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">LAUFZEIT / PASSIV</text>
    </svg>
  </div>
</body>
</html>
