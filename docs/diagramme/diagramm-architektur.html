<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architektur</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 880px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ATL #1 · Architektur</p>
    <h1>Drei Schichten, eine Richtung</h1>

    <svg viewBox="0 0 960 328" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="atl1-schichten-title atl1-schichten-desc">
      <title id="atl1-schichten-title">Schichtenarchitektur des URL-Shorteners</title>
      <desc id="atl1-schichten-desc">Layer-Stack mit API-Schicht, Service-Schicht und Daten-Schicht über einer SQLite-Datenbank; Abhängigkeiten zeigen ausschliesslich von oben nach unten, die hervorgehobene Service-Schicht enthält die HTTP-freie, testbare Geschäftslogik.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Richtungsindikator (linker Rand, ausserhalb des Stapels) -->
      <text x="24" y="28" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ABHÄNGIGKEIT</text>
      <line x1="72" y1="48" x2="72" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Stapel: Grundfläche -->
      <rect x="120" y="40" width="792" height="256" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="40" width="792" height="256" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

      <!-- Store-Band (Datenbank) -->
      <rect x="121" y="232" width="790" height="63" rx="0" fill="rgba(45,49,66,0.05)"/>

      <!-- Hairline-Trennlinien -->
      <line x1="120" y1="104" x2="912" y2="104" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="120" y1="168" x2="912" y2="168" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="120" y1="232" x2="912" y2="232" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- Fokal-Band (Service-Schicht) -->
      <rect x="120" y="104" width="792" height="64" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>

      <!-- Band 1: API-Schicht -->
      <text x="136" y="76" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">01</text>
      <text x="176" y="77" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">API-Schicht</text>
      <text x="896" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Router · HTTP · Statuscodes · Validierung · Auth-Guard</text>

      <!-- Band 2: Service-Schicht (fokal) -->
      <text x="136" y="140" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">02</text>
      <text x="176" y="141" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Service-Schicht</text>
      <text x="896" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">reine, testbare Geschäftslogik · kein HTTP</text>

      <!-- Band 3: Daten-Schicht -->
      <text x="136" y="204" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">03</text>
      <text x="176" y="205" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Daten-Schicht</text>
      <text x="896" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">SQLModel · Persistenz</text>

      <!-- Band 4: Datenbank (Store) -->
      <text x="136" y="268" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DB</text>
      <text x="176" y="269" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Datenbank</text>
      <text x="896" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">SQLite</text>
    </svg>
  </div>
</body>
</html>
