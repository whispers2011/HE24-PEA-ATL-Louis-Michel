<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funktionsweise</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">URL-Shortener · Ablauf</p>
    <h1>Wie der URL-Shortener funktioniert</h1>

    <svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="atl2-flow-title atl2-flow-desc">
      <title id="atl2-flow-title">Ablauf: Kurzlink anlegen, weiterleiten, auswerten</title>
      <desc id="atl2-flow-desc">Ein Benutzer legt per API einen Kurzlink an und teilt ihn; Besucher werden beim Aufruf mit 307 weitergeleitet, jeder Klick wird gezählt und der Benutzer ruft die Statistik ab.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-link-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lebenslinien -->
      <line x1="160" y1="96" x2="160" y2="508" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="480" y1="96" x2="480" y2="508" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="96" x2="800" y2="508" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Aktivierungsbalken API -->
      <rect x="476" y="136" width="8" height="56" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="476" y="272" width="8" height="112" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="476" y="416" width="8" height="56" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- 1: Link anlegen -->
      <line x1="160" y1="144" x2="476" y2="144" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="272" y="124" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="133" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LINK ANLEGEN</text>
      <rect x="264" y="152" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="161" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">POST /api/links · JWT</text>

      <!-- 2: Kurzlink zurueck (Headline) -->
      <line x1="476" y1="184" x2="160" y2="184" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="284" y="164" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="173" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KURZLINK</text>
      <rect x="272" y="192" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="201" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">…run.app/abc123</text>

      <!-- 3: Link teilen (asynchron) -->
      <line x1="160" y1="240" x2="800" y2="240" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <rect x="288" y="220" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="328" y="229" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LINK TEILEN</text>

      <!-- 4: Aufruf des Kurzlinks -->
      <line x1="800" y1="280" x2="484" y2="280" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link-l)"/>
      <rect x="600" y="260" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="269" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /abc123</text>

      <!-- 5: Klick speichern (Self-Message) -->
      <path d="M 484,312 H 536 Q 544,312 544,320 V 328 Q 544,336 536,336 H 488" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="552" y="316" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="580" y="325" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KLICK +1</text>

      <!-- 6: Weiterleitung -->
      <line x1="484" y1="376" x2="800" y2="376" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="592" y="356" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="365" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">307 REDIRECT</text>
      <rect x="592" y="384" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="393" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">zur Ziel-URL</text>

      <!-- 7: Statistik abrufen -->
      <line x1="160" y1="424" x2="476" y2="424" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="272" y="404" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="413" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STATS ABRUFEN</text>

      <!-- 8: Klickzahlen -->
      <line x1="476" y1="464" x2="160" y2="464" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="276" y="444" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="453" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KLICKZAHLEN</text>
      <rect x="272" y="472" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="481" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">total · pro Tag</text>

      <!-- Akteure -->
      <rect x="80" y="48" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="48" width="160" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="160" y="69" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Benutzer</text>
      <text x="160" y="85" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Konto · JWT-Login</text>

      <rect x="400" y="48" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="48" width="160" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="480" y="69" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">URL-Shortener</text>
      <text x="480" y="85" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">API auf Cloud Run</text>

      <rect x="720" y="48" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="48" width="160" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="800" y="69" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Besucher</text>
      <text x="800" y="85" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ohne Konto</text>

      <!-- Legende -->
      <line x1="30" y1="524" x2="930" y2="524" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDE</text>
      <line x1="120" y1="540" x2="148" y2="540" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="156" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">API-AUFRUF</text>
      <line x1="264" y1="540" x2="292" y2="540" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="300" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ANTWORT / ASYNCHRON</text>
      <line x1="472" y1="540" x2="500" y2="540" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="508" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">DER KURZLINK (KERNPRODUKT)</text>
    </svg>
  </div>
</body>
</html>
