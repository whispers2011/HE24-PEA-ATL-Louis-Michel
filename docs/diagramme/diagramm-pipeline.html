<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI/CD-Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ATL #2 · Cloud Build</p>
    <h1>Die Pipeline: testen, bauen, deployen — oder abbrechen</h1>

    <svg viewBox="0 0 960 776" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="atl2-pipe-title atl2-pipe-desc">
      <title id="atl2-pipe-title">Ablauf der CI/CD-Pipeline</title>
      <desc id="atl2-pipe-desc">Jeder Push startet die Pipeline: Bei roten Tests bricht der Build sofort ab, sonst wird das Image gebaut; nur Pushes auf den main-Branch werden anschliessend in die Registry geladen und auf Cloud Run deployt.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Pfeile (vor den Boxen) -->
      <line x1="400" y1="88" x2="400" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="192" x2="400" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Tests gruen? NEIN -> Abbruch (Akzent) -->
      <line x1="488" y1="272" x2="648" y2="272" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="548" y="252" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="568" y="261" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEIN</text>

      <!-- Tests gruen? JA -->
      <line x1="400" y1="312" x2="400" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="408" y="324" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="333" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JA</text>

      <line x1="400" y1="416" x2="400" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- main? NEIN -->
      <line x1="488" y1="496" x2="648" y2="496" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="548" y="476" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="568" y="485" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEIN</text>

      <!-- main? JA -->
      <line x1="400" y1="536" x2="400" y2="576" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="408" y="548" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="557" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JA</text>

      <line x1="400" y1="640" x2="400" y2="672" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Start -->
      <rect x="312" y="40" width="176" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="312" y="40" width="176" height="48" rx="24" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="400" y="61" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Push aufs Repository</text>
      <text x="400" y="77" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">jeder Branch</text>

      <!-- Tests -->
      <rect x="304" y="128" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="304" y="128" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tests und Linting</text>
      <text x="400" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ruff · pytest · Coverage 100%</text>

      <!-- Entscheidung: Tests gruen? -->
      <polygon points="400,232 488,272 400,312 312,272" fill="#f5f5f5"/>
      <polygon points="400,232 488,272 400,312 312,272" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tests grün?</text>

      <!-- Abbruch (fokal) -->
      <rect x="648" y="248" width="232" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="648" y="248" width="232" height="48" rx="24" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="764" y="269" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Build bricht ab</text>
      <text x="764" y="285" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kein Image · kein Deploy</text>

      <!-- Image bauen -->
      <rect x="304" y="352" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="304" y="352" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Docker-Image bauen</text>
      <text x="400" y="398" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">inkl. Frontend-Build</text>

      <!-- Entscheidung: main? -->
      <polygon points="400,456 488,496 400,536 312,496" fill="#f5f5f5"/>
      <polygon points="400,456 488,496 400,536 312,496" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Push auf main?</text>

      <!-- Nur gebaut -->
      <rect x="648" y="472" width="232" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="648" y="472" width="232" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="764" y="493" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fertig: geprüft, kein Deploy</text>
      <text x="764" y="509" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Feature-Branch: bauen + testen genügt</text>

      <!-- Push + Deploy -->
      <rect x="288" y="576" width="224" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="576" width="224" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="604" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Image pushen und deployen</text>
      <text x="400" y="622" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Artifact Registry · gcloud run deploy</text>

      <!-- Live -->
      <rect x="312" y="672" width="176" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="312" y="672" width="176" height="48" rx="24" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="400" y="693" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Neue Revision live</text>
      <text x="400" y="709" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">…europe-west6.run.app</text>

      <!-- Legende -->
      <line x1="30" y1="740" x2="930" y2="740" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="760" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDE</text>
      <rect x="120" y="750" width="28" height="14" rx="7" fill="none" stroke="#7a8399" stroke-width="1"/>
      <text x="156" y="760" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">START / ENDE</text>
      <rect x="260" y="750" width="28" height="14" rx="2" fill="none" stroke="#2d3142" stroke-width="1"/>
      <text x="296" y="760" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">SCHRITT</text>
      <polygon points="414,750 432,757 414,764 396,757" fill="none" stroke="#2d3142" stroke-width="1"/>
      <text x="440" y="760" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ENTSCHEIDUNG</text>
      <line x1="560" y1="757" x2="588" y2="757" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="596" y="760" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ABBRUCH BEI ROTEN TESTS</text>
    </svg>
  </div>
</body>
</html>
